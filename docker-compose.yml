# Kinda temp file (secrets and stuff)

version: '3'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL} # Reference the .env variable
    environment:
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
      - AUTHENTIK_ID=${AUTHENTIK_ID}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    secrets:
      - NEXTAUTH_SECRET
      - AUTHENTIK_SECRET
    ports:
      - '3000:3000'

secrets:
  NEXTAUTH_SECRET:
    file: .env.local
  AUTHENTIK_SECRET:
    file: .env.local
